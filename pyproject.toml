[project]
name = "marketdata"
version = "0.1.0"
description = "Universal Multi-Asset Market Data Downloader and Cache"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "yfinance>=0.2.30",
    "requests>=2.31.0",
    "curl_cffi>=0.7.0",
    "rich>=13.0.0",
    "ccxt>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "matplotlib>=3.10.9",
    "plotly>=7.0.0",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
fast = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
]

[project.scripts]
marketdata = "marketdata.cli:main"
marketdata-mcp = "marketdata.mcp_server:run_mcp_server"
marketdata-tray = "marketdata.tray:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["marketdata*"]
exclude = ["data*", "tests*", "scratch*"]
